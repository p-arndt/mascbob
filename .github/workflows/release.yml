name: Release

# Publishes the pushed tag to npm, pushes the showcase image to GHCR and creates
# the GitHub Release. The shared workflows in p-arndt/.github have no npm
# pipeline yet, so the npm part is local; it follows container-release.yml:
# stamp verifies the tag, the notes come from the annotated tag, third-party
# actions are pinned to full commit SHAs.
#
# npm auth: trusted publishing (OIDC) once it is configured for the package on
# npmjs.com; until then an NPM_TOKEN secret. npm uses whichever is available.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Two runs publishing at once would race on the dist-tags; queue them, never cancel one.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # The showcase site as ghcr.io/p-arndt/mascbob. The GitHub Release comes from
  # the publish job, so the shared workflow skips its own.
  image:
    needs: ci
    uses: p-arndt/.github/.github/workflows/container-release.yml@v1
    permissions:
      contents: write
      packages: write
    with:
      changelog: none

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify the tag and read the release notes
        id: stamp
        uses: p-arndt/stamp@f4b7acfb14f4ebe4b592b60d13b90c954474df7e # v0.5.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      # `prepack` packages the library and runs publint. Pre-releases go to the
      # `next` dist-tag so `npm install mascbob` keeps resolving to the stable one.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.stamp.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.stamp.outputs.notes-file }}
          prerelease: ${{ steps.stamp.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
