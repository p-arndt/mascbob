name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  sveltekit:
    uses: p-arndt/.github/.github/workflows/sveltekit-ci.yml@v1
    with:
      # Component tests run in a real browser through vitest + playwright.
      setup-command: pnpm exec playwright install --with-deps chromium
      test-command: pnpm test
      # The build packages the library and runs publint.
      build: true
