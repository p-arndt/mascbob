# static-web-server config for the showcase image (see Dockerfile).

[general]
root = "/public"
port = 8080
compression = true
log-level = "info"

[advanced]

# HTML must revalidate: after a deploy, a cached page would still point at
# hashed chunks that no longer exist.
[[advanced.headers]]
source = "**"
[advanced.headers.headers]
Cache-Control = "no-cache"

# Content-hashed by Vite, so a changed file always gets a new name.
[[advanced.headers]]
source = "/_app/immutable/**"
[advanced.headers.headers]
Cache-Control = "public, max-age=31536000, immutable"
